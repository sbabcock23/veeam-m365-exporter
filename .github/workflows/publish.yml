name: Publish to Docker Hub

# Trigger the workflow every time code is pushed to the main branch or tags are pushed
on:
  push:
    branches: [ "main" ]
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Check out the code
        uses: actions/checkout@v4

      # 2. Extract Docker metadata (tags & labels)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/simple-multi-ad-iam
          tags: |
            # Set 'latest' tag only when pushing to the default branch (main)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag with branch name (e.g., main)
            type=ref,event=branch
            # Tag with Git tag name (e.g., v1.0.0)
            type=ref,event=tag
            # Tag with short commit SHA (e.g., sha-a1b2c3d)
            type=sha,format=short

      # 3. Set up Docker Buildx (enables advanced build features & caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log into Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and push Docker image with layer caching
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enable GitHub Actions build cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
